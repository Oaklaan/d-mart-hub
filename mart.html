<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find D-Mart Near Me</title>
<style>
  :root{
    --green:#1a7a3c;
    --green-dark:#0f4d26;
    --yellow:#ffcb05;
    --cream:#fdf9ef;
    --ink:#1c1c1c;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Georgia', 'Times New Roman', serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(26,122,60,0.06) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(255,203,5,0.10) 0%, transparent 40%);
  }
  .card{
    background:#fff;
    max-width:460px;
    width:100%;
    border-radius:18px;
    padding:40px 32px;
    box-shadow:0 20px 50px rgba(15,77,38,0.15);
    border:3px solid var(--green-dark);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:-40px; right:-40px;
    width:130px; height:130px;
    background:var(--yellow);
    border-radius:50%;
    opacity:0.35;
  }
  .badge{
    display:inline-block;
    background:var(--yellow);
    color:var(--green-dark);
    font-weight:bold;
    font-size:12px;
    letter-spacing:1.5px;
    padding:5px 12px;
    border-radius:999px;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  h1{
    font-size:32px;
    color:var(--green-dark);
    line-height:1.15;
    margin-bottom:8px;
    position:relative;
  }
  h1 span{color:var(--green);}
  p.sub{
    color:#555;
    font-size:15px;
    margin-bottom:28px;
    line-height:1.5;
  }
  button{
    width:100%;
    background:var(--green);
    color:#fff;
    border:none;
    padding:15px;
    font-size:16px;
    font-weight:bold;
    border-radius:10px;
    cursor:pointer;
    font-family:inherit;
    letter-spacing:0.3px;
    transition:transform 0.15s ease, background 0.2s ease;
    box-shadow:0 6px 0 var(--green-dark);
  }
  button:hover{background:#218c47;}
  button:active{transform:translateY(4px); box-shadow:0 2px 0 var(--green-dark);}
  #status{
    margin-top:18px;
    font-size:14px;
    color:#555;
    min-height:20px;
  }
  #status.error{color:#b3261e;}
  .links{
    margin-top:20px;
    display:none;
    flex-direction:column;
    gap:10px;
  }
  .links a{
    display:block;
    text-decoration:none;
    background:var(--cream);
    border:2px solid var(--green);
    color:var(--green-dark);
    font-weight:bold;
    padding:12px 16px;
    border-radius:10px;
    font-size:15px;
    transition:background 0.2s ease;
  }
  .links a:hover{background:#eef8ef;}
  .foot{
    margin-top:26px;
    font-size:12px;
    color:#999;
    text-align:center;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Grocery Finder</span>
    <h1>Find a <span>D-Mart</span> near you</h1>
    <p class="sub">Tap the button below to share your location and instantly search for the closest D-Mart stores on the map.</p>

    <button id="findBtn" onclick="findDmart()">📍 Find D-Mart Near Me</button>

    <div id="status"></div>

    <div class="links" id="links">
      <a id="mapsLink" href="#" target="_blank" rel="noopener">🗺️ Open in Google Maps</a>
      <a id="mapsAppLink" href="#" target="_blank" rel="noopener">🔍 See Search Results List</a>
    </div>

    <div class="foot">Location is used only in your browser to build a map search link. Nothing is stored.</div>
  </div>

<script>
function findDmart(){
  const status = document.getElementById('status');
  const links = document.getElementById('links');
  const btn = document.getElementById('findBtn');

  links.style.display = 'none';
  status.className = '';
  status.textContent = 'Locating you...';
  btn.disabled = true;

  if(!navigator.geolocation){
    status.className = 'error';
    status.textContent = 'Geolocation is not supported by your browser. Try the search link below instead.';
    showFallback();
    btn.disabled = false;
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      status.textContent = 'Location found! Opening results below 👇';

      document.getElementById('mapsLink').href =
        `https://www.google.com/maps/search/D-Mart/@${lat},${lng},14z`;
      document.getElementById('mapsAppLink').href =
        `https://www.google.com/maps/search/?api=1&query=D-Mart&query_place_id=&center=${lat},${lng}`;

      links.style.display = 'flex';
      btn.disabled = false;
    },
    (err) => {
      status.className = 'error';
      status.textContent = 'Could not get your location (permission denied or unavailable). Use the search link below.';
      showFallback();
      btn.disabled = false;
    }
  );
}

function showFallback(){
  const links = document.getElementById('links');
  document.getElementById('mapsLink').href = 'https://www.google.com/maps/search/D-Mart+near+me';
  document.getElementById('mapsAppLink').href = 'https://www.google.com/maps/search/D-Mart+near+me';
  links.style.display = 'flex';
}
</script>
</body>
</html>
